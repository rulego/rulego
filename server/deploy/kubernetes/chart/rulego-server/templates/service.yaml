apiVersion: v1
kind: Service
metadata:
  name: {{ include "rulego-server.fullname" . }}
  labels:
    {{- include "rulego-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- range .Values.service.extraPorts }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort | default .port }}
      protocol: TCP
    {{- end }}
  selector:
    {{- include "rulego-server.selectorLabels" . | nindent 4 }}
