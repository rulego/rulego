# RuleGo Server Configuration
# Full configuration reference with default values.
# Commented-out entries are optional or contain sensitive values — uncomment to override.

# =============================================================================
# General
# =============================================================================

# Data directory for storing rule chains, logs, and other persistent data
data_dir = ./data

# Global skill storage path
skill_path = ./data/skills

# HTTP server listen address
server = :9090

# Default username used when auth is disabled
default_username = admin

# API route base path prefix (for embedded mode), e.g. /rulego
#base_path =

# =============================================================================
# Security
# =============================================================================

# Shell command security mode: allow (whitelist, default) or deny (blacklist)
cmd_mode = allow

# Shell command whitelist (effective in allow mode)
cmd_white_list = cp,scp,mvn,npm,yarn,git,make,cmake,docker,kubectl,helm,ansible,puppet,pytest,python,python3,pip,go,java,dotnet,gcc,g++,ctest

# Shell command deny list (always effective, higher priority than whitelist)
cmd_deny_list =

# Denied command argument patterns (rejected if args contain a match)
cmd_deny_args =

# File path whitelist for file node access. Supports wildcards, e.g. /data/*/output. Comma-separated.
file_path_white_list = /tmp

# Whether to load Lua standard libraries
load_lua_libs = true

# =============================================================================
# Authentication
# =============================================================================

# Enable JWT authentication for API access. If false, all requests use the default user identity.
#require_auth = false

# JWT secret key (use env var JWT_SECRET_KEY in production)
#jwt_secret_key = ${JWT_SECRET_KEY:-r6G7qZ8xk9P0y1Q2w3E4r5T6y7U8i9O0pL7z8x9CvBnM3k2l1}

# JWT expiration time in milliseconds (default: 12 hours)
#jwt_expire_time = 43200000

# JWT issuer
#jwt_issuer = rulego.cc

# Global secret key for encryption/decryption
#secret_key =

# =============================================================================
# Logging
# =============================================================================

# Log node debug data to log file
debug = true

# Maximum node log size (number of entries)
max_node_log_size = 40

# Log file path. Empty means console output only.
#log_file =

# Log level: debug, info, warn, error
#log_level = info

# Maximum size of a single log file in MB
#log_max_size = 100

# Maximum number of old log files to retain
#log_max_backups = 30

# Maximum number of days to retain old log files
#log_max_age = 7

# =============================================================================
# Runtime
# =============================================================================

# Static resource mapping, format: /url-path/=/disk-path/, comma-separated
resource_mapping = /editor/=./editor,/images/=./editor/images

# Node pool file path
node_pool_file = ./node_pool.json

# Save rule chain execution run logs to file
save_run_log = true

# Run log storage type: bbolt (default) or file (JSON Lines)
#run_log_store_type = bbolt

# Keep only the most recent N run logs, 0 means unlimited
#run_log_retention_count = 0

# Keep only run logs from the last N days, 0 means unlimited
#run_log_retention_days = 0

# Script maximum execution time in milliseconds
script_max_execution_time = 5000

# Component marketplace base URL
#marketplace_base_url =

# Use the default HTTP server as a shared node
share_http_server = true

# Allow CORS (set to false in production if only same-origin access is needed)
allow_cors = true

# HTTP read timeout in seconds
read_timeout = 30

# HTTP write timeout in seconds (long value for AI chat streaming)
write_timeout = 300

# Maximum request body size in MB
max_body_size = 10

# Enable endpoint framework for external integrations (MQTT, Kafka, etc.)
#endpoint_enabled = true

# Rule chain ID for processing core event bus events
#event_bus_chain_id =

# Organize rule chains by category folders
#category_folder_enabled = false

# =============================================================================
# MCP Server
# =============================================================================

[mcp]
# Enable MCP (Model Context Protocol) service
enable = true

# Default MCP endpoint: always exposes management API tools (rule chain CRUD, component query, etc.)
# Components and rule chains are exposed ONLY through groups below.

# MCP tool groups configuration
# Each key is a group name, value is a comma-separated tool list.
# Syntax: * = all tools, -prefix* = exclude by prefix
#         rules = management API tools, components = component tools, chains = chain tools
# Example:
# [mcp.groups]
# readonly = rules,list_components,get_component_doc
# full = *
# no-delete = *,-delete_rule_chain
# iot = rules,components,chains,-_assistant

# Manager group for external AI clients (Claude Code, Cursor, etc.)
# Only includes rule chain management tools, no component/chain tools.
# URL: http://localhost:9090/api/v1/mcp/{apiKey}/group/manager
[mcp.groups]
manager = preview_rule_chain,save_rule_chain,list_rule_chains,get_rule_chain,delete_rule_chain,operate_rule_chain,execute_rule_chain,list_components,get_component_doc

# =============================================================================
# Pprof (Performance Profiling)
# =============================================================================

[pprof]
# Enable pprof HTTP endpoint
enable = false

# Pprof listen address
addr = 0.0.0.0:6060

# =============================================================================
# Global Custom Configuration
# Components can reference values via ${global.xxx}
# =============================================================================

[global]
data_dir = ./data

# Database configuration (uncomment and configure as needed)
#sqlDriver = mysql
#sqlDsn = root:root@tcp(127.0.0.1:3306)/test

# LLM configuration for AI agents (use env vars in production)
#llm_url = ${LLM_URL:-https://open.bigmodel.cn/api/coding/paas/v4}
#llm_api_key = ${LLM_API_KEY}
#llm_model = ${LLM_MODEL:-GLM-5}

# =============================================================================
# Users
# Format: username = password[,apiKey]
# If apiKey is set, callers can access APIs directly using the apiKey without login.
# =============================================================================

[users]
admin = admin,2af255ea5618467d914c67a8beeca31d
#user01 = user01,2af255ea5618467d914c67a8beeca51c
